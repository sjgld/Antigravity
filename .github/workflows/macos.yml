name: macOS 简体中文版 (Apple Silicon)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Apple Silicon 构建环境（可切换以避开繁忙队列）'
        type: choice
        options:
          - macos-15
          - macos-26
        default: macos-15
      release:
        description: '发布到现有 Release（留空则只生成构建产物）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      AG_FULL_VERSION: '2.31.2_1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64-zh-cn
      - name: 检查中文化覆盖
        run: python3 tools/check_localization.py
      - name: macOS 测试
        run: cargo test --locked --release --target aarch64-apple-darwin
      - name: 编译 macOS 版本
        run: cargo build --locked --release --bin ag_unlocker --target aarch64-apple-darwin
      - name: 签名、打包与启动检查
        run: python3 tools/package_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: AG_2.31.2_1_macos_zh-CN_arm64
          path: |
            dist/AG_2.31.2_1_macos.tar.gz
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error
      - name: 发布到中文版 Release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
        run: |
          test "$RELEASE_TAG" = "v$AG_FULL_VERSION"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" dist/AG_2.31.2_1_macos.tar.gz dist/SHA256SUMS-macos.txt --repo "$GITHUB_REPOSITORY"
